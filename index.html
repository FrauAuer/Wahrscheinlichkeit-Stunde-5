<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mit welcher Augensumme haben wir die größte Gewinnchance?</title>
  <style>
    @font-face {
      font-family: 'FibelNord';
      src: url('./FibelNord-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'FibelNord';
      src: url('./FibelNord-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --ok: #166534;
      --okbg: #dcfce7;
      --warn: #92400e;
      --warnbg: #fef3c7;
      --focus: #dbeafe;
      --head: #f3f4f6;
      --button: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'FibelNord', Arial, sans-serif;
      font-size: 1.2rem;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
    }

    .title {
      margin: 0;
      font-size: 2rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1.2rem;
      font-family: inherit;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      background: var(--button);
      color: white;
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .note {
      padding: 12px 14px;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
    }

    .note.ok {
      background: var(--okbg);
      color: var(--ok);
      display: block;
    }

    .note.warn {
      background: var(--warnbg);
      color: var(--warn);
      display: block;
    }

    .sum {
      margin-top: 12px;
      font-weight: 700;
    }

    .input-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      table-layout: fixed;
    }

    .input-table th,
    .input-table td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: center;
      vertical-align: middle;
    }

    .input-table th {
      background: var(--head);
      font-weight: 700;
    }

    .input-table td:first-child {
      font-weight: 700;
      width: 32%;
    }

    .input-table input {
      text-align: center;
      min-height: 46px;
    }

    .input-table tbody tr:focus-within {
      background: var(--focus);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="title">Mit welcher Augensumme haben wir die größte Gewinnchance?</h1>
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <label for="lessonCode">Passwort</label>
          <input id="lessonCode" type="text" placeholder="55" />
        </div>
        <div>
          <label for="groupName">Gruppennummer</label>
          <input id="groupName" type="number" min="1" step="1" placeholder="1" inputmode="numeric" />
        </div>
      </div>

      <table class="input-table" aria-label="Eingabetabelle für Augensummen">
        <thead>
          <tr>
            <th>Augensumme</th>
            <th>Wie oft habt ihr die Augensumme gewürfelt?</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>2</td><td><input id="n1" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
          <tr><td>3</td><td><input id="n2" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
          <tr><td>4</td><td><input id="n3" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
          <tr><td>5</td><td><input id="n4" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
          <tr><td>6</td><td><input id="n5" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
          <tr><td>7</td><td><input id="n6" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
          <tr><td>8</td><td><input id="n7" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
          <tr><td>9</td><td><input id="n8" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
          <tr><td>10</td><td><input id="n9" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
          <tr><td>11</td><td><input id="n10" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
          <tr><td>12</td><td><input id="n11" type="number" min="0" step="1" value="0" inputmode="numeric" /></td></tr>
        </tbody>
      </table>

      <div class="sum" id="totalText">Anzahl der Würfe: 0</div>

      <div class="actions">
        <button id="saveBtn">senden</button>
      </div>

      <div id="message" class="note"></div>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { ref, set, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js';

    const lessonCodeInput = document.getElementById('lessonCode');
    const groupNameInput = document.getElementById('groupName');
    const message = document.getElementById('message');
    const totalText = document.getElementById('totalText');
    const saveBtn = document.getElementById('saveBtn');
    const ids = ['n1', 'n2', 'n3', 'n4', 'n5', 'n6', 'n7', 'n8', 'n9', 'n10', 'n11'];

    const urlParams = new URLSearchParams(window.location.search);
    lessonCodeInput.value = urlParams.get('lesson') || '';

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `note ${type}`;
    }

    function getCounts() {
      return ids.map((id) => Math.max(0, Number(document.getElementById(id).value) || 0));
    }

    function updateTotal() {
      const total = getCounts().reduce((sum, value) => sum + value, 0);
      totalText.textContent = `Anzahl der Würfe: ${total}`;
    }

    ids.forEach((id) => {
      const input = document.getElementById(id);

      input.addEventListener('focus', () => {
        if (input.value === '0') {
          input.value = '';
        }
      });

      input.addEventListener('input', () => {
        let value = input.value.replace(/\D/g, '');
        value = value.replace(/^0+(?=\d)/, '');
        input.value = value;
        updateTotal();
      });

      input.addEventListener('blur', () => {
        if (input.value === '') {
          input.value = '0';
        }
        updateTotal();
      });
    });

    updateTotal();

    saveBtn.addEventListener('click', async () => {
      const lessonCode = lessonCodeInput.value.trim().toLowerCase();
      const groupName = groupNameInput.value.trim();
      const counts = getCounts();
      const total = counts.reduce((sum, value) => sum + value, 0);

      if (!lessonCode) {
        showMessage('Bitte gebt zuerst das Passwort ein.', 'warn');
        return;
      }

      if (!groupName) {
        showMessage('Bitte gebt eine Gruppennummer ein.', 'warn');
        return;
      }

      if (!/^\d+$/.test(groupName)) {
        showMessage('Bitte gebt eine gültige Gruppennummer (nur Zahlen) ein.', 'warn');
        return;
      }

      if (total === 0) {
        showMessage('Bitte tragt mindestens eine Zahl größer als 0 ein.', 'warn');
        return;
      }

      const payload = {
        lessonCode,
        groupName,
        counts: {
          '1': counts[0],
          '2': counts[1],
          '3': counts[2],
          '4': counts[3],
          '5': counts[4],
          '6': counts[5],
          '7': counts[6],
          '8': counts[7],
          '9': counts[8],
          '10': counts[9],
          '11': counts[10]
        },
        total,
        updatedAt: Date.now(),
        updatedAtServer: serverTimestamp()
      };

      saveBtn.disabled = true;
      saveBtn.textContent = 'speichert ...';

      try {
        await set(ref(db, `Stunde5/${lessonCode}/groups/${groupName}`), payload);
        showMessage('gespeichert', 'ok');
      } catch (error) {
        console.error(error);
        showMessage('Speichern nicht möglich. Bitte versucht es erneut oder fragt Frau Auer.', 'warn');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'senden';
      }
    });
  </script>
</body>
</html>
